pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,json,md,yml,yaml}"
      run: npx prettier --check {staged_files}
    - name: lint
      glob: "*.{ts,tsx}"
      run: npx eslint --max-warnings 0 --no-warn-ignored {staged_files}
    - name: typecheck
      glob: "*.{ts,tsx}"
      run: npm run -s typecheck
commit-msg:
  jobs:
    - name: commitlint
      run: npx commitlint --edit {1}
pre-push:
  jobs:
    - name: check
      run: npm run -s check
