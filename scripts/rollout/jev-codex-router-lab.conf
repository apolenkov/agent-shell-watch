# CI is named CI and its one job is verify. No .nvmrc, so Node is named. The commitlint config is a
# one-line .js file and CI does not run commitlint, so it is left alone.
CI_NAME=CI
FIXABLE_RE='verify'
CODEQL_NAME=codeql
NODE_LINE='node-version: 20'
PROTECTED_EXTRA='.editorconfig openspec/* fixtures/* artifacts/* CHANGELOG.md SECURITY.md'
COMMITLINT=
