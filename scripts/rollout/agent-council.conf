# Release-please files and vendored types are not for the agent; Dependabot needs the commitlint ignore.
CI_NAME=ci
FIXABLE_RE='check'
CODEQL_NAME=codeql
NODE_LINE='node-version-file: .nvmrc'
PROTECTED_EXTRA='.editorconfig .gitignore release-please-config.json .release-please-manifest.json version.txt CHANGELOG.md .claude-plugin/* hooks/hooks.json engine-types/* types/* scripts/update-types.sh'
COMMITLINT=commitlint.config.ts
