# The check is a matrix of six Test jobs, so any of them may fail together. No .nvmrc (engines >=22.18).
# commitlint uses single quotes, so the ignore patch is left to a person if CI ever runs it.
CI_NAME=CI
FIXABLE_RE='Test \(Node .+ on .+\)'
CODEQL_NAME=codeql
NODE_LINE='node-version: 24'
PROTECTED_EXTRA='.editorconfig install.sh uninstall.sh CHANGELOG.md SECURITY.md openspec/* .agents/* CONTEXT.md docs/adr/*'
COMMITLINT=
