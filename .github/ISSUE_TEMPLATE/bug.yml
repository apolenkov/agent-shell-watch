name: Bug
description: Something a mod does wrong
labels: [bug]
body:
  - type: dropdown
    id: mod
    attributes: { label: Mod, options: [shell-flow, council] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Claude Code version, placeholder: "claude --version" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: debug
    attributes:
      label: Debug log
      description: Lines naming the mod from `claude --debug` (~/.claude/debug/latest)
      render: text
