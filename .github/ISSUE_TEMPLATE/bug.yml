name: Bug
description: Something shell-flow does wrong
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Claude Code version, placeholder: "claude --version" }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: textarea
    id: debug
    attributes:
      label: Debug log
      description: Lines naming shell-flow from `claude --debug` (~/.claude/debug/latest)
      render: text
